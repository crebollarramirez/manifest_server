name: manifest-cad-agent

services:
  cad-agent:
    image: manifest-cad-agent:local
    build:
      context: ../..
      dockerfile: services/cad_agent/Dockerfile
    environment:
      SUPABASE_URL: ${SUPABASE_URL_DOCKER:-http://host.docker.internal:54321}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      CAD_AGENT_PORT: ${CAD_AGENT_PORT:-3000}
      CAD_AGENT_POLL_INTERVAL_MS: ${CAD_AGENT_POLL_INTERVAL_MS:-2000}
      CAD_AGENT_DEPENDENCY_TIMEOUT_SECONDS: ${CAD_AGENT_DEPENDENCY_TIMEOUT_SECONDS:-300}
      CAD_AGENT_LEASE_SECONDS: ${CAD_AGENT_LEASE_SECONDS:-300}
    ports:
      - "${CAD_AGENT_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped

  cad-tool-worker:
    image: manifest-cad-editor:local
    build:
      context: ../..
      dockerfile: workers/cad_editor/Dockerfile
    environment:
      SUPABASE_URL: ${SUPABASE_URL_DOCKER:-http://host.docker.internal:54321}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
      CAD_TOOL_JOB_POLL_INTERVAL_SECONDS: ${CAD_TOOL_JOB_POLL_INTERVAL_SECONDS:-2}
      CAD_TOOL_LEASE_SECONDS: ${CAD_TOOL_LEASE_SECONDS:-300}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../..:/app
    init: true
    restart: unless-stopped
